# ==============================================================================
# ZIMBANI PLATFORM - Production Redis 7 Configuration
# ==============================================================================

port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF enabled for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""
