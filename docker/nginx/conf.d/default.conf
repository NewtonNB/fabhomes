# ==============================================================================
# ZIMBANI PLATFORM - Nginx Reverse Proxy & Unified API Gateway
# ==============================================================================

upstream php_backend {
    server app:9000;
    keepalive 32;
}

upstream reverb_websocket {
    server reverb:8080;
    keepalive 32;
}

upstream react_frontend {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Security Headers Gateway Injection
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"zimbani_gateway"}';
        add_header Content-Type application/json;
    }

    # Laravel Reverb WebSockets Gateway
    location /app/ {
        proxy_pass http://reverb_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Laravel Backend API Routing
    location ~ ^/(api|sanctum)/ {
        limit_req zone=zimbani_api_limit burst=30 nodelay;

        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffering on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 120s;
        }
    }

    # Storage Public Media Delivery
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Frontend Client SPA Routing
    location / {
        proxy_pass http://react_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny dotfiles except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
