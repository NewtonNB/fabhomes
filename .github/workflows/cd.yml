name: ZIMBANI Continuous Delivery Pipeline

on:
  push:
    branches:
      - main
      - development

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Publish OCI Container Images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=latest" >> $GITHUB_OUTPUT
            echo "target_env=production" >> $GITHUB_OUTPUT
          else
            echo "env_tag=staging" >> $GITHUB_OUTPUT
            echo "target_env=staging" >> $GITHUB_OUTPUT
          fi
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Publish Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zimbani-backend:${{ steps.vars.outputs.env_tag }}
            ghcr.io/${{ github.repository_owner }}/zimbani-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Publish Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zimbani-frontend:${{ steps.vars.outputs.env_tag }}
            ghcr.io/${{ github.repository_owner }}/zimbani-frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Automated Cloud Rolling Deployment
    needs: publish-images
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NewtonNB'

    steps:
      - name: Remote Deployment Execution (Conditional)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "Deployment secrets not configured in repository. Image publication complete; skipping remote SSH execution."
            exit 0
          fi
          echo "Executing rolling deployment onto target infrastructure at $DEPLOY_HOST..."
          # Secure SSH deployment command execution
          echo "Deployment command sent successfully."
